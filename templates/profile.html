{% extends "base.html" %}{% block title %}My Profile | CivicFix{% endblock %}{% block content %}<main class="auth-wrap"><section class="auth-card"><a href="{{ url_for('user_dashboard') }}">← Back to dashboard</a><span class="eyebrow">ACCOUNT SETTINGS</span><h1>My profile</h1>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<form method="POST" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" value="{{ user.name }}" maxlength="100" required></label><label>Email address<input type="email" name="email" value="{{ user.email }}" maxlength="160" required></label><button class="primary-btn">Save profile</button></form><p><small>Account created: {{ user.created_at }}</small></p></section></main>{% endblock %}
